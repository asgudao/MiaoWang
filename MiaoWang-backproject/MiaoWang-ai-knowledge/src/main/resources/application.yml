spring:
  config:
    #读取哪个配置文件（配置中心上的）
    import:
      - optional:nacos:MiaoWang-all-service.yaml
      - optional:nacos:MiaoWang-service-ai-knowledge-dev.yaml
      - optional:nacos:MiaoWang-ai-common.yaml
  cloud:
    nacos:
      config:
        server-addr: 192.168.137.128:8848 #配置中心地址
        username: nacos
        password: nacos
        #namespace: #命名空间的id值，不写就是默认public命名空间
        #group: DEFAULT_GROUP
      discovery:
        server-addr: 192.168.137.128:8848
        username: nacos
        password: nacos

# Milvus 向量数据库（RAG 向量召回路）
milvus:
  uri: http://192.168.137.128:19530
  collection-name: miao_wang_knowledge_fragment
  dimension: 1024
  top-k: 10

