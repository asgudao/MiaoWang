server:
  port: 7000
spring:
  application:
    name: api-gateway
  cloud:
    nacos:
      server-addr: 192.168.137.128:8848 #nacos服务器地址
      username: nacos
      password: nacos
      discovery:
        username: nacos
        password: nacos
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true #让gateway可以发现nacos中的运行微服务

#不用登录就能访问（白名单）：知识库为公开内容区，免 token 访问
gateway:
  auth:
    white-list:
      - /MiaoWang-user/mapleleaf/miaowang/v1/user/login
      - /MiaoWang-user/mapleleaf/miaowang/v1/user/register
      - /MiaoWang-knowledge/**
      #- /service-product/product/**
      - /favicon.ico