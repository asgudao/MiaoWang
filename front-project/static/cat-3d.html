<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #E8F4F8; font-family: sans-serif; }
canvas { display: block; }
#loading {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: #FF8C42; font-size: 18px; z-index: 100;
}
</style>
</head>
<body>
<div id="loading">🐱 加载中...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const loading = document.getElementById("loading");
const w = window.innerWidth, h = window.innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#E8F4F8");
scene.fog = new THREE.Fog("#E8F4F8", 5, 15);

const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 50);
camera.position.set(0, 1.8, 6);
camera.lookAt(0, 0.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(w, h);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// 灯光
scene.add(new THREE.AmbientLight("#FFF5E8", 2.5));

const key = new THREE.DirectionalLight("#FFFFFF", 5);
key.position.set(8, 10, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 40;
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0001;
scene.add(key);

scene.add(new THREE.DirectionalLight("#FFD5B0", 2).translateX(-3).translateY(1).translateZ(-2));
scene.add(new THREE.DirectionalLight("#B0D0FF", 1.5).translateY(0.5).translateZ(-4));

// 地面
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 48),
  new THREE.MeshStandardMaterial({ color: "#F0EBE0", roughness: 0.85 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.6;
ground.receiveShadow = true;
scene.add(ground);

// 底部柔光投影
const halo = new THREE.Mesh(
  new THREE.PlaneGeometry(2.4, 2.4),
  new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uColor: { value: new THREE.Color("#000000") } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec2 vUv; uniform vec3 uColor; void main(){ float d=length(vUv-0.5)*2.0; gl_FragColor=vec4(uColor,(1.0-d)*0.12); }'
  })
);
halo.rotation.x = -Math.PI/2;
halo.position.y = -1.58;
scene.add(halo);

// 轨道控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.2; controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.65; controls.minPolarAngle = 0.2;
controls.autoRotate = true; controls.autoRotateSpeed = 0.3;
controls.update();

// 加载 GLB
let mixer = null;
let catGroup = null;
const clock = new THREE.Clock();

new GLTFLoader().load("/static/chonky_cat_trio.glb", (gltf) => {
  loading.style.display = "none";
  catGroup = gltf.scene;

  // 调试：打印模型结构
  console.log("Model loaded:", catGroup);
  gltf.scene.traverse((node) => {
    if (node.isMesh) {
      node.castShadow = true;
      node.receiveShadow = true;
    }
  });

  // 自适应缩放
  const box = new THREE.Box3().setFromObject(catGroup);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 2.5 / maxDim;
  catGroup.scale.setScalar(scale);

  // 居中
  const center = box.getCenter(new THREE.Vector3());
  catGroup.position.set(-center.x * scale, -center.y * scale + 0.2, -center.z * scale);

  scene.add(catGroup);

  // 播放动画
  if (gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(catGroup);
    gltf.animations.forEach((clip) => {
      const action = mixer.clipAction(clip);
      action.play();
    });
    console.log("Animations:", gltf.animations.length);
  }
}, (p) => {
  loading.textContent = "🐱 加载中 " + Math.round(p.loaded/1024) + "KB...";
});

// 点击弹跳
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let bounce = 0;

renderer.domElement.addEventListener("click", (e) => {
  mouse.x = (e.clientX/w)*2-1;
  mouse.y = -(e.clientY/h)*2+1;
  raycaster.setFromCamera(mouse, camera);
  if (catGroup) {
    const hits = raycaster.intersectObject(catGroup, true);
    if (hits.length > 0) bounce = 1;
  }
});

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  controls.update();

  if (mixer) mixer.update(dt);

  // 点击弹跳
  if (bounce > 0) {
    bounce -= dt * 3;
    const t = Math.max(0, bounce);
    const s = 1 + Math.sin(t * Math.PI) * 0.08;
    catGroup.scale.setScalar(s * 2.5 / (new THREE.Box3().setFromObject(catGroup).getSize(new THREE.Vector3()).length() * 0.3));
    if (bounce <= 0) {
      const box = new THREE.Box3().setFromObject(catGroup);
      const maxDim = Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, box.getSize(new THREE.Vector3()).z);
      catGroup.scale.setScalar(2.5 / maxDim);
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
